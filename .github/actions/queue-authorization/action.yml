name: Verify queued task authorization
description: 确认本次 workflow_dispatch 对应队列中正在执行且授权仍有效的请求
inputs:
  queue-request-id:
    required: true
  item-number:
    required: true
  workflow:
    required: true
  expected-head-sha:
    required: false
outputs:
  qa-after-review:
    description: '仅实现流程创建的审查请求自动接续 QA'
    value: ${{ steps.authorize.outputs.qa-after-review }}
runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      id: authorize
      env:
        QUEUE_REQUEST_ID: ${{ inputs.queue-request-id }}
        ITEM_NUMBER: ${{ inputs.item-number }}
        EXPECTED_WORKFLOW: ${{ inputs.workflow }}
        EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
      with:
        script: |
          const number = Number(process.env.ITEM_NUMBER);
          if (!Number.isSafeInteger(number) || number < 1) throw new Error('无效队列来源编号。');
          const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: number, per_page: 100 });
          async function readRequest() {
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: number, per_page: 100 });
            return comments.filter((comment) => comment.user?.login === 'github-actions[bot]').map((comment) => {
              const match = comment.body.match(/<!-- agent-subscription-queue:v1 ([A-Za-z0-9+/=]+) -->/);
              if (!match) return undefined;
              try { return JSON.parse(Buffer.from(match[1], 'base64').toString('utf8')); } catch { return undefined; }
            }).find((entry) => entry?.id === process.env.QUEUE_REQUEST_ID);
          }
          let request;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            request = await readRequest();
            if (request?.status === 'running' && request.workflow === process.env.EXPECTED_WORKFLOW
              && String(request.runId) === String(context.runId)) break;
            request = undefined;
            await new Promise((resolve) => setTimeout(resolve, 2000));
          }
          if (!request) {
            throw new Error('队列请求不存在、未领取或不属于当前工作流。');
          }
          core.setOutput('qa-after-review', request.kind === 'review' && request.inputs.qa_after_review === 'true' ? 'true' : 'false');
          const { data: source } = await github.rest.issues.get({ ...context.repo, issue_number: number });
          const labels = source.labels.map((label) => typeof label === 'string' ? label : label.name);
          if (source.state !== 'open' || !labels.includes(request.inputs.authorization_label)) {
            throw new Error('来源已关闭或执行标签已撤销，取消队列请求。');
          }
          if (process.env.EXPECTED_HEAD_SHA) {
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.head.sha !== process.env.EXPECTED_HEAD_SHA || pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('PR 分支版本已变化或来自 fork，取消队列请求。');
            }
          }
