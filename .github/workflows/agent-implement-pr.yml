name: Agent Implement PR

on:
  # Agent Queue dispatches only after confirming this is an open same-repository PR.
  workflow_dispatch:
    inputs:
      pr_number:
        description: '队列中的目标 PR 编号'
        type: string
        required: true
      queue_request_id:
        description: '由持久化订阅队列分发的请求编号'
        type: string
        required: true
      expected_head_sha:
        description: '入队时记录的 PR 分支版本'
        type: string
        required: false

jobs:
  implement-pr:
    if: github.event_name == 'workflow_dispatch' && inputs.queue_request_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: write

    env:
      CODEX_MODEL: ${{ vars.CODEX_MODEL }}
      PR_NUMBER: ${{ inputs.pr_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout trusted queue scripts
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify queued authorization
        uses: ./.github/actions/queue-authorization
        with:
          queue-request-id: ${{ inputs.queue_request_id }}
          item-number: ${{ inputs.pr_number }}
          workflow: agent-implement-pr.yml
          expected-head-sha: ${{ inputs.expected_head_sha }}

      - name: Read PR branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view "$PR_NUMBER" --json state,headRefName,headRefOid --jq 'select(.state == "OPEN") | [.headRefName, .headRefOid] | @tsv' > "$RUNNER_TEMP/pr.tsv"
          if [ ! -s "$RUNNER_TEMP/pr.tsv" ]; then
            echo "PR #$PR_NUMBER is closed; refusing queued work." >&2
            exit 1
          fi
          IFS=$'\t' read -r branch head_sha < "$RUNNER_TEMP/pr.tsv"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          echo "BRANCH_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"

      - name: Verify queued branch version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          if [ -n "$EXPECTED_HEAD_SHA" ] && [ "$EXPECTED_HEAD_SHA" != "${BRANCH_HEAD_SHA}" ]; then
            echo "PR branch changed after enqueue; please re-add agent:implement." >&2
            exit 1
          fi

      - name: Transition labels
        if: success()
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR branch
        if: success()
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare branch
        if: success()
        run: |
          git fetch origin main:main || git fetch origin main
          git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

      - name: Setup Node.js and pnpm
        if: success()
        uses: ./.github/actions/setup

      - name: Build
        if: success()
        run: pnpm build

      - name: Restore Codex subscription
        id: auth
        if: success()
        uses: ./.github/actions/codex-auth-restore
        with:
          auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}

      - name: Run implement-PR agent
        if: success()
        env:
          OUTPUT_DIR: ${{ runner.temp }}
        run: pnpm exec tsx .sandcastle/agent-workflows/implement-pr/implement-pr.ts

      - name: Save refreshed Codex subscription
        if: always() && steps.auth.outputs.restored == 'true'
        uses: ./.github/actions/codex-auth-save
        with:
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}

      - name: Push branch
        if: success()
        run: |
          gh pr view "$PR_NUMBER" --json state,headRefOid,labels > "$RUNNER_TEMP/current-pr.json"
          jq -e --arg sha "$BRANCH_HEAD_SHA" '.state == "OPEN" and .headRefOid == $sha and any(.labels[]; .name == "agent:in-progress") and (all(.labels[]; .name != "agent:blocked"))' "$RUNNER_TEMP/current-pr.json" > /dev/null
          if [ "$(cat "${RUNNER_TEMP}/has_commits.txt")" != "true" ]; then
            echo "No commits to push."
            exit 0
          fi
          set +e
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during implement-PR run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi

      - name: Post thread replies
        if: success()
        env:
          REPLIES: ${{ runner.temp }}/implement_thread_replies.json
        run: |
          count=$(jq 'length' "$REPLIES")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            commentId=$(jq -r ".[$i].commentId" "$REPLIES")
            body=$(jq -r ".[$i].body" "$REPLIES")
            rest_id=$(gh api graphql -f query="query(\$id:ID!){ node(id:\$id){ ... on PullRequestReviewComment { databaseId } } }" -F id="$commentId" --jq '.data.node.databaseId')
            if [ -z "$rest_id" ] || [ "$rest_id" = "null" ]; then
              echo "Could not resolve REST id for $commentId; skipping" >&2
              continue
            fi
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments/${rest_id}/replies" -f body="$body"
          done

      - name: Post inline comments
        if: success()
        env:
          COMMENTS: ${{ runner.temp }}/implement_new_inline_comments.json
        run: |
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          head_sha=$(git rev-parse HEAD)
          for i in $(seq 0 $((count - 1))); do
            path=$(jq -r ".[$i].path" "$COMMENTS")
            line=$(jq -r ".[$i].line" "$COMMENTS")
            body=$(jq -r ".[$i].body" "$COMMENTS")
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments" \
              -f commit_id="$head_sha" \
              -f path="$path" \
              -F line="$line" \
              -f side="RIGHT" \
              -f body="$body"
          done

      - name: Post top-level comments
        if: success()
        env:
          COMMENTS: ${{ runner.temp }}/implement_top_level_comments.json
        run: |
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            body=$(jq -r ".[$i].body" "$COMMENTS")
            gh pr comment "$PR_NUMBER" --body "$body"
          done

      - name: Mark blocked on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:implement` PR run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:implement` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always()
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
