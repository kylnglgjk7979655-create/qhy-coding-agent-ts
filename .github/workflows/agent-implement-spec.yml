name: Agent Implement Spec

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: '父 Issue 编号'
        type: string
        required: true
      queue_request_id:
        description: '持久队列请求编号'
        type: string
        required: true

jobs:
  implement:
    if: inputs.queue_request_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: agent-ticket-control-${{ github.repository }}-${{ inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      CODEX_MODEL: ${{ vars.CODEX_MODEL }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HAS_AGENT_PAT: ${{ secrets.AGENT_PAT != '' }}
      BRANCH: agent/spec-${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      - name: Verify queued authorization
        uses: ./.github/actions/queue-authorization
        with:
          queue-request-id: ${{ inputs.queue_request_id }}
          item-number: ${{ inputs.issue_number }}
          workflow: agent-implement-spec.yml
      - uses: ./.github/actions/setup
      - name: Prepare integration branch
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            echo '集成分支已存在，请人工核查已有进度。' >&2
            exit 1
          fi
          git config user.name 'sandcastle-agent[bot]'
          git config user.email 'sandcastle-agent[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
      - name: Restore Codex subscription
        id: auth
        uses: ./.github/actions/codex-auth-restore
        with:
          auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}
      - name: Enable Codex subagents
        run: |
          printf '\n[features]\nmulti_agent = true\n' >> "$CODEX_HOME/config.toml"
      - name: Implement spec
        run: pnpm exec tsx .sandcastle/agent-workflows/implement-spec/implement-spec.ts
      - name: Save refreshed Codex subscription
        if: always() && steps.auth.outputs.restored == 'true'
        uses: ./.github/actions/codex-auth-save
        with:
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}
      - name: Verify and mark PR ready
        run: pnpm exec tsx .sandcastle/agent-workflows/implement-spec/verify.ts
      - name: Report failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "spec 实现未完成。请检查运行日志和已有分支、草稿 PR 后再处理：$RUN_URL"
