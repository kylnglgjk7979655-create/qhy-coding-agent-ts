name: Agent Implement Spec

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'agent:implement-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: agent-ticket-control-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HAS_AGENT_PAT: ${{ secrets.AGENT_PAT != '' }}
      BRANCH: agent/spec-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup
      - name: Prepare integration branch
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            echo '集成分支已存在，请人工核查已有进度。' >&2
            exit 1
          fi
          git config user.name 'sandcastle-agent[bot]'
          git config user.email 'sandcastle-agent[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Prepare Claude Code config
        run: |
          mkdir -p "$HOME/.claude"
          printf '{"hasCompletedOnboarding":true}\n' > "$HOME/.claude.json"
      - name: Implement spec
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: pnpm exec tsx .sandcastle/agent-workflows/implement-spec/implement-spec.ts
      - name: Verify and mark PR ready
        run: pnpm exec tsx .sandcastle/agent-workflows/implement-spec/verify.ts
      - name: Report failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "spec 实现未完成。请检查运行日志和已有分支、草稿 PR 后再处理：$RUN_URL"