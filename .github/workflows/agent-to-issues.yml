name: Agent To Issues
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: '队列中的目标 Issue 编号'
        type: string
        required: true
      queue_request_id:
        description: '由持久化订阅队列分发的请求编号'
        type: string
        required: true
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.queue_request_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: agent-ticket-control-${{ github.repository }}-${{ inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL }}
    outputs:
      started: ${{ steps.prepare.outputs.started }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify queued authorization
        uses: ./.github/actions/queue-authorization
        with:
          queue-request-id: ${{ inputs.queue_request_id }}
          item-number: ${{ inputs.issue_number }}
          workflow: agent-to-issues.yml
      - uses: ./.github/actions/setup
      - name: Capture source before agent runs
        id: prepare
        env:
          OUTPUT_DIR: ${{ runner.temp }}/tickets
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: ticket-source
          path: ${{ runner.temp }}/tickets/source.json
      - name: Restore Codex subscription
        id: auth
        uses: ./.github/actions/codex-auth-restore
        with:
          auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}
      - name: Draft ticket plan
        env:
          SOURCE_FILE: ${{ runner.temp }}/tickets/source.json
          OUTPUT_DIR: ${{ runner.temp }}/tickets
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/to-issues.ts
      - name: Save refreshed Codex subscription
        if: always() && steps.auth.outputs.restored == 'true'
        uses: ./.github/actions/codex-auth-save
        with:
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: ticket-plan
          path: ${{ runner.temp }}/tickets/plan.json
  publish:
    needs: plan
    if: always() && needs.plan.outputs.started == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-ticket-control-${{ github.repository }}-${{ inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        if: needs.plan.result == 'success'
        with:
          name: ticket-source
          path: ${{ runner.temp }}/source
      - uses: actions/download-artifact@v4
        if: needs.plan.result == 'success'
        with:
          name: ticket-plan
          path: ${{ runner.temp }}/plan
      - name: Validate and create sub-issues
        if: needs.plan.result == 'success'
        env:
          SOURCE_FILE: ${{ runner.temp }}/source/source.json
          PLAN_FILE: ${{ runner.temp }}/plan/plan.json
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts publish
      - name: Report split or publication failure
        if: failure() || needs.plan.result != 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked"
          gh issue comment "$ISSUE_NUMBER" --body "拆票或创建子任务失败。请检查 $RUN_URL；发布中断时可重新运行失败的 job，复用同一计划补齐子任务和依赖。需求已变化时需先清理旧子任务，再重新添加 agent:to-issues。"
      - name: Always remove in-progress
        if: always()
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress"
