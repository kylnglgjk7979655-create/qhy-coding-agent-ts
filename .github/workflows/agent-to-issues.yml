name: Agent To Issues
on:
  issues:
    types: [labeled]
jobs:
  plan:
    if: github.event.label.name == 'agent:to-issues'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: agent-ticket-control-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
    outputs:
      started: ${{ steps.prepare.outputs.started }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Capture source before agent runs
        id: prepare
        env:
          OUTPUT_DIR: ${{ runner.temp }}/tickets
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: ticket-source
          path: ${{ runner.temp }}/tickets/source.json
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Prepare Claude Code config
        run: |
          mkdir -p "$HOME/.claude"
          printf '{"hasCompletedOnboarding":true}\n' > "$HOME/.claude.json"
      - name: Draft ticket plan
        env:
          SOURCE_FILE: ${{ runner.temp }}/tickets/source.json
          OUTPUT_DIR: ${{ runner.temp }}/tickets
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/to-issues.ts
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: ticket-plan
          path: ${{ runner.temp }}/tickets/plan.json
  publish:
    needs: plan
    if: always() && needs.plan.outputs.started == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-ticket-control-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        if: needs.plan.result == 'success'
        with:
          name: ticket-source
          path: ${{ runner.temp }}/source
      - uses: actions/download-artifact@v4
        if: needs.plan.result == 'success'
        with:
          name: ticket-plan
          path: ${{ runner.temp }}/plan
      - name: Validate and create sub-issues
        if: needs.plan.result == 'success'
        env:
          SOURCE_FILE: ${{ runner.temp }}/source/source.json
          PLAN_FILE: ${{ runner.temp }}/plan/plan.json
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts publish
      - name: Report split or publication failure
        if: failure() || needs.plan.result != 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked"
          gh issue comment "$ISSUE_NUMBER" --body "拆票或创建子任务失败。请检查 $RUN_URL；发布中断时可重新运行失败的 job，复用同一计划补齐子任务和依赖。需求已变化时需先清理旧子任务，再重新添加 agent:to-issues。"
      - name: Always remove in-progress
        if: always()
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress"