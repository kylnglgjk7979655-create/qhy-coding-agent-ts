name: Agent QA Only

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '同仓库、开放且携带 agent:qa-only 标签的 PR 编号'
        type: string
        required: true
      queue_request_id:
        description: '由持久化订阅队列分发的请求编号'
        type: string
        required: true
      expected_head_sha:
        description: '入队时记录的 PR 分支版本'
        type: string
        required: true

jobs:
  qa-only:
    if: github.event_name == 'workflow_dispatch' && inputs.queue_request_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      CODEX_MODEL: ${{ vars.CODEX_MODEL }}
      PR_NUMBER: ${{ inputs.pr_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout trusted queue scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify queued authorization
        uses: ./.github/actions/queue-authorization
        with:
          queue-request-id: ${{ inputs.queue_request_id }}
          item-number: ${{ inputs.pr_number }}
          workflow: agent-qa-only.yml
          expected-head-sha: ${{ inputs.expected_head_sha }}

      - name: Validate PR snapshot
        id: pr
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh pr view "$PR_NUMBER" --json state,isCrossRepository,headRefName,headRefOid,labels > "$RUNNER_TEMP/qa-pr.json"
          jq -e --arg sha "$EXPECTED_HEAD_SHA" '.state == "OPEN" and .isCrossRepository == false and .headRefOid == $sha and any(.labels[]; .name == "agent:qa-only")' "$RUNNER_TEMP/qa-pr.json" > /dev/null
          branch=$(jq -r '.headRefName' "$RUNNER_TEMP/qa-pr.json")
          git check-ref-format --branch "$branch" > /dev/null
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          printf 'head_sha=%s\n' "$EXPECTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'BRANCH=%s\nBRANCH_HEAD_SHA=%s\n' "$branch" "$EXPECTED_HEAD_SHA" >> "$GITHUB_ENV"

      - name: Transition labels
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:qa-only"
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          path: worktree
          persist-credentials: false

      - name: Prepare comparison base
        working-directory: worktree
        run: git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch origin main:main

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Build
        working-directory: worktree
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Restore Codex subscription
        id: auth
        uses: ./.github/actions/codex-auth-restore
        with:
          auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}

      - name: Run QA Only agent
        working-directory: worktree
        env:
          OUTPUT_DIR: ${{ runner.temp }}
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          tsx "$GITHUB_WORKSPACE/.sandcastle/agent-workflows/qa-only/qa-only.ts"

      - name: Save refreshed Codex subscription
        if: always() && steps.auth.outputs.restored == 'true'
        uses: ./.github/actions/codex-auth-save
        with:
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-only-${{ inputs.pr_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/qa-only
          if-no-files-found: warn
          retention-days: 14

      - name: Publish QA report for unchanged PR
        if: success()
        id: report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json state,headRefOid,labels > "$RUNNER_TEMP/qa-current-pr.json"
          jq -e --arg sha "$BRANCH_HEAD_SHA" '.state == "OPEN" and .headRefOid == $sha and any(.labels[]; .name == "agent:in-progress") and all(.labels[]; .name != "agent:blocked")' "$RUNNER_TEMP/qa-current-pr.json" > /dev/null
          jq -e --arg sha "$BRANCH_HEAD_SHA" '.testedHead == $sha' "$RUNNER_TEMP/qa-only/result.json" > /dev/null
          cat "$RUNNER_TEMP/qa-only/report.md" > "$RUNNER_TEMP/qa-comment.md"
          printf '\n运行及证据 artifact：%s\n' "$RUN_URL" >> "$RUNNER_TEMP/qa-comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/qa-comment.md"

      - name: Check QA verdict
        if: success()
        run: |
          verdict=$(cat "$RUNNER_TEMP/qa-only/verdict.txt")
          printf 'QA verdict: %s\n' "$verdict"
          cat "$RUNNER_TEMP/qa-only/report.md"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$RUNNER_TEMP/qa-only/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$verdict" != pass ]; then
            echo "::error::QA $verdict：验收未通过，原因见上方报告与 PR 评论。"
            exit 1
          fi

      - name: Mark blocked on failure
        if: failure()
        env:
          REPORT_PUBLISHED: ${{ steps.report.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          if [ "$REPORT_PUBLISHED" != success ]; then
            printf '`agent:qa-only` 未能发布有效验收报告。\n\n运行记录：%s\n\n处理原因后重新添加 `agent:qa-only`。\n' "$RUN_URL" > "$RUNNER_TEMP/qa-failure.md"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/qa-failure.md"
          fi

      - name: Always remove in-progress
        if: always()
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
