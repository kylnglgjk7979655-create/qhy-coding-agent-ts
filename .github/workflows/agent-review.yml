name: Agent Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '内部接续：同仓库、开放且携带 agent:review 标签的 PR 编号'
        type: string
        required: true
      queue_request_id:
        description: '由持久化订阅队列分发的请求编号'
        type: string
        required: true
      qa_after_review:
        description: '兼容旧队列参数；当前不自动接续 QA'
        type: string
        default: 'false'
        required: false
      expected_head_sha:
        description: '入队时记录的 PR 分支版本'
        type: string
        required: false

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' && inputs.queue_request_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: write

    env:
      CODEX_MODEL: ${{ vars.CODEX_MODEL }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout trusted queue scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify queued authorization
        id: authorization
        uses: ./.github/actions/queue-authorization
        with:
          queue-request-id: ${{ inputs.queue_request_id }}
          item-number: ${{ inputs.pr_number }}
          workflow: agent-review.yml
          expected-head-sha: ${{ inputs.expected_head_sha }}

      - name: Read and verify PR
        id: pr
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          gh pr view "$PR_NUMBER" --json state,headRefName,headRefOid --jq 'select(.state == "OPEN") | [.headRefName, .headRefOid] | @tsv' > "$RUNNER_TEMP/pr.tsv"
          if [ ! -s "$RUNNER_TEMP/pr.tsv" ]; then echo "PR is closed." >&2; exit 1; fi
          IFS=$'\t' read -r branch head_sha < "$RUNNER_TEMP/pr.tsv"
          if [ -n "$EXPECTED_HEAD_SHA" ] && [ "$EXPECTED_HEAD_SHA" != "$head_sha" ]; then
            echo "PR branch changed after enqueue; please re-add agent:review." >&2; exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          echo "BRANCH_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"

      - name: Validate PR and resolve current snapshot
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            exit 1
          fi
          pr_file="$RUNNER_TEMP/dispatched-pr.json"
          gh pr view "$PR_NUMBER" --json state,isCrossRepository,headRefName,headRefOid,labels > "$pr_file"
          jq -e '.state == "OPEN" and .isCrossRepository == false and any(.labels[]; .name == "agent:review")' "$pr_file" > /dev/null
          branch=$(jq -r '.headRefName' "$pr_file")
          sha=$(jq -r '.headRefOid' "$pr_file")
          git check-ref-format --branch "$branch" > /dev/null
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          printf 'BRANCH=%s\nBRANCH_HEAD_SHA=%s\n' "$branch" "$sha" >> "$GITHUB_ENV"

      - name: Transition labels
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          path: worktree
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare branch
        working-directory: worktree
        run: |
          git fetch origin main:main || git fetch origin main
          git checkout -B "$BRANCH" "$BRANCH_HEAD_SHA"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Build
        working-directory: worktree
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Restore Codex subscription
        id: auth
        uses: ./.github/actions/codex-auth-restore
        with:
          auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}

      - name: Run review agent
        working-directory: worktree
        env:
          OUTPUT_DIR: ${{ runner.temp }}
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          tsx "$GITHUB_WORKSPACE/.sandcastle/agent-workflows/review/review.ts"

      - name: Save refreshed Codex subscription
        if: always() && steps.auth.outputs.restored == 'true'
        uses: ./.github/actions/codex-auth-save
        with:
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}

      - name: Push branch
        working-directory: worktree
        if: success()
        run: |
          gh pr view "$PR_NUMBER" --json state,headRefOid,labels > "$RUNNER_TEMP/current-pr.json"
          jq -e --arg sha "$BRANCH_HEAD_SHA" '.state == "OPEN" and .headRefOid == $sha and any(.labels[]; .name == "agent:in-progress") and (all(.labels[]; .name != "agent:blocked"))' "$RUNNER_TEMP/current-pr.json" > /dev/null
          set +e
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during review run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi

      - name: Check review changes without PAT
        working-directory: worktree
        if: success()
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          if [ -z "$AGENT_PAT" ] && [ "$(git rev-parse HEAD)" != "$BRANCH_HEAD_SHA" ]; then
            gh api --method POST "repos/$GH_REPO/actions/workflows/check.yml/dispatches" -f ref="$BRANCH"
          fi

      - name: Post PR review
        if: success()
        env:
          PAYLOAD: ${{ runner.temp }}/review_payload.json
        run: gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/reviews" --input "$PAYLOAD"

      - name: Mark PR ready
        if: success()
        run: gh pr ready "$PR_NUMBER" || true

      - name: Post thread replies
        if: success()
        env:
          REPLIES: ${{ runner.temp }}/replies.json
        run: |
          count=$(jq 'length' "$REPLIES")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            commentId=$(jq -r ".[$i].commentId" "$REPLIES")
            body=$(jq -r ".[$i].body" "$REPLIES")
            rest_id=$(gh api graphql -f query="query(\$id:ID!){ node(id:\$id){ ... on PullRequestReviewComment { databaseId } } }" -F id="$commentId" --jq '.data.node.databaseId')
            if [ -z "$rest_id" ] || [ "$rest_id" = "null" ]; then
              echo "Could not resolve REST id for $commentId; skipping" >&2
              continue
            fi
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments/${rest_id}/replies" -f body="$body"
          done

      - name: Mark blocked on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:review` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:review` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always()
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
