name: Codex Promote Queued
on:
  issues:
    types: [closed, labeled, reopened]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: agent-promote-${{ github.repository }}
  cancel-in-progress: false
env:
  CODEX_AUTH_SLOTS: ${{ vars.CODEX_AUTH_SLOTS }}
jobs:
  promote:
    if: github.event_name != 'issues' || github.event.action == 'reopened' || (github.event.action == 'closed' && github.event.issue.state_reason != 'not_planned') || github.event.label.name == 'agent:queued'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: await require('./.github/scripts/tasks.cjs').promote({ github, context, core })
