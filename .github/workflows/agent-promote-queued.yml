name: Agent Promote Queued
on:
  issues:
    types: [labeled, closed, reopened]
  pull_request:
    types: [closed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
# 扫描持久化标签，事件合并不丢任务；不占用订阅认证锁。
concurrency:
  group: ${{ (github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'agent:queued') && format('agent-promote-queued-{0}', github.repository) || format('agent-ignored-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  promote:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (github.event.action != 'labeled' || github.event.label.name == 'agent:queued')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AGENT_PAT: ${{ secrets.AGENT_PAT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Promote one eligible queued issue
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts promote
