name: Codex Promote Queued
on:
  issues:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  actions: write
concurrency:
  group: codex-subscription-${{ github.repository }}
  cancel-in-progress: false
jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.state_reason != 'not_planned'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: await require('./.github/scripts/tasks.cjs').promote({ github, context, core })
