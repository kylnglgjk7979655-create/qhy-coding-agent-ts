name: Agent Promote Queued
on:
  issues:
    types: [closed]
concurrency:
  group: agent-promote-queued-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  promote:
    if: github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AGENT_PAT: ${{ secrets.AGENT_PAT }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Promote eligible direct dependents
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts promote