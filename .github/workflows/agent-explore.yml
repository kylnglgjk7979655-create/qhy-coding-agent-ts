name: Agent Explore

# Batch triage. Any `agent:explore` label kicks a run, but each run ignores the
# event payload and explores EVERY open `agent:explore` issue together.
on:
  issues:
    types: [labeled]

jobs:
  explore:
    if: github.event.label.name == 'agent:explore'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: agent-explore-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    env:
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
    outputs:
      count: ${{ steps.batch.outputs.count }}

    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      # Never read issue titles or bodies into shell or `${{ }}` — they are
      # untrusted. They go to a JSON file and only the TS scripts read them.
      - name: List batch
        id: batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BATCH_DIR: ${{ runner.temp }}/batch
        run: |
          set -euo pipefail
          sleep 5
          mkdir -p "$BATCH_DIR"
          gh issue list \
            --state open \
            --label "agent:explore" \
            --limit 1000 \
            --json number,title,body,author,createdAt,url,comments \
            > "$BATCH_DIR/issues.json"
          count=$(jq 'length' "$BATCH_DIR/issues.json")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Batch: $(jq -r '[.[].number | "#\(.)"] | join(", ")' "$BATCH_DIR/issues.json")"

      # Uploaded before the agent runs, so the apply job validates the plan
      # against a batch the agent could not have tampered with.
      - name: Upload batch
        if: steps.batch.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: explore-batch
          path: ${{ runner.temp }}/batch/issues.json

      - name: Setup Node.js and pnpm
        if: steps.batch.outputs.count != '0'
        uses: ./.github/actions/setup

      - name: Build
        if: steps.batch.outputs.count != '0'
        run: pnpm build

      - name: Install Claude Code
        if: steps.batch.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code@2.1.323

      - name: Prepare Claude Code config
        if: steps.batch.outputs.count != '0'
        run: |
          mkdir -p "$HOME/.claude"
          printf '{"hasCompletedOnboarding":true}\n' > "$HOME/.claude.json"

      - name: Run explore agent
        if: steps.batch.outputs.count != '0'
        env:
          ISSUES_FILE: ${{ runner.temp }}/batch/issues.json
          OUTPUT_DIR: ${{ runner.temp }}/out
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: pnpm exec tsx .sandcastle/agent-workflows/explore/explore.ts

      - name: Upload plan
        if: steps.batch.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: explore-plan
          path: ${{ runner.temp }}/out/

  apply:
    needs: explore
    if: needs.explore.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Download batch
        uses: actions/download-artifact@v4
        with:
          name: explore-batch
          path: ${{ runner.temp }}/batch

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: explore-plan
          path: ${{ runner.temp }}/out

      # Validates the whole plan first; on any problem it changes nothing and
      # fails, leaving every agent:explore label in place for the next run.
      - name: Apply plan
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          BATCH_FILE: ${{ runner.temp }}/batch/issues.json
          PLAN_FILE: ${{ runner.temp }}/out/plan.json
          OUTPUT_DIR: ${{ runner.temp }}
        run: pnpm exec tsx .sandcastle/agent-workflows/explore/apply.ts