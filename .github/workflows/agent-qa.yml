name: Agent QA

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '同仓库、开放且携带 agent:qa 标签的 PR 编号'
        type: string
        required: true
      queue_request_id:
        description: '由持久化订阅队列分发的请求编号'
        type: string
        required: true
      expected_head_sha:
        description: '入队时记录的 PR 分支版本'
        type: string
        required: true

jobs:
  qa:
    if: github.event_name == 'workflow_dispatch' && inputs.queue_request_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      CODEX_MODEL: ${{ vars.CODEX_MODEL }}
      PR_NUMBER: ${{ inputs.pr_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout trusted queue scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify queued authorization
        uses: ./.github/actions/queue-authorization
        with:
          queue-request-id: ${{ inputs.queue_request_id }}
          item-number: ${{ inputs.pr_number }}
          workflow: agent-qa.yml
          expected-head-sha: ${{ inputs.expected_head_sha }}

      - name: Validate PR snapshot
        id: pr
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh pr view "$PR_NUMBER" --json state,isCrossRepository,headRefName,headRefOid,labels > "$RUNNER_TEMP/qa-pr.json"
          jq -e --arg sha "$EXPECTED_HEAD_SHA" '.state == "OPEN" and .isCrossRepository == false and .headRefOid == $sha and any(.labels[]; .name == "agent:qa")' "$RUNNER_TEMP/qa-pr.json" > /dev/null
          branch=$(jq -r '.headRefName' "$RUNNER_TEMP/qa-pr.json")
          git check-ref-format --branch "$branch" > /dev/null
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          printf 'head_sha=%s\n' "$EXPECTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'BRANCH=%s\nBRANCH_HEAD_SHA=%s\n' "$branch" "$EXPECTED_HEAD_SHA" >> "$GITHUB_ENV"

      - name: Transition labels
        id: transition
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:qa"
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          path: worktree
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare branch
        working-directory: worktree
        run: |
          git fetch origin main:main
          git checkout -B "$BRANCH" "$BRANCH_HEAD_SHA"
          git config user.name 'sandcastle-agent[bot]'
          git config user.email 'sandcastle-agent[bot]@users.noreply.github.com'

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Build
        working-directory: worktree
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Restore Codex subscription
        id: auth
        uses: ./.github/actions/codex-auth-restore
        with:
          auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}

      - name: Enable Codex subagents
        run: |
          printf '\n[features]\nmulti_agent = true\n' >> "$CODEX_HOME/config.toml"

      - name: Run QA agent
        working-directory: worktree
        env:
          OUTPUT_DIR: ${{ runner.temp }}
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          tsx "$GITHUB_WORKSPACE/.sandcastle/agent-workflows/qa/qa.ts"

      - name: Save refreshed Codex subscription
        if: always() && steps.auth.outputs.restored == 'true'
        uses: ./.github/actions/codex-auth-save
        with:
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ inputs.pr_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/qa
          if-no-files-found: warn
          retention-days: 14

      - name: Push QA repairs
        working-directory: worktree
        if: success()
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json state,headRefOid,labels > "$RUNNER_TEMP/qa-current-pr.json"
          jq -e --arg sha "$BRANCH_HEAD_SHA" '.state == "OPEN" and .headRefOid == $sha and any(.labels[]; .name == "agent:in-progress") and all(.labels[]; .name != "agent:blocked")' "$RUNNER_TEMP/qa-current-pr.json" > /dev/null
          final_head=$(git rev-parse HEAD)
          jq -e --arg sha "$final_head" '.finalHead == $sha' "$RUNNER_TEMP/qa/result.json" > /dev/null
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "HEAD:refs/heads/$BRANCH"
          printf 'QA_FINAL_HEAD=%s\n' "$final_head" >> "$GITHUB_ENV"

      - name: Check QA changes without PAT
        if: success()
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          if [ -z "$AGENT_PAT" ] && [ "$QA_FINAL_HEAD" != "$BRANCH_HEAD_SHA" ]; then
            gh api --method POST "repos/$GH_REPO/actions/workflows/check.yml/dispatches" -f ref="$BRANCH"
          fi

      - name: Publish QA report for final PR version
        if: success()
        id: report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json state,headRefOid,labels > "$RUNNER_TEMP/qa-current-pr.json"
          jq -e --arg sha "$QA_FINAL_HEAD" '.state == "OPEN" and .headRefOid == $sha and any(.labels[]; .name == "agent:in-progress") and all(.labels[]; .name != "agent:blocked")' "$RUNNER_TEMP/qa-current-pr.json" > /dev/null
          jq -e --arg sha "$QA_FINAL_HEAD" '.finalHead == $sha' "$RUNNER_TEMP/qa/result.json" > /dev/null
          cat "$RUNNER_TEMP/qa/report.md" > "$RUNNER_TEMP/qa-comment.md"
          printf '\n运行及证据 artifact：%s\n' "$RUN_URL" >> "$RUNNER_TEMP/qa-comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/qa-comment.md"

      - name: Check QA verdict
        if: success()
        run: test "$(cat "$RUNNER_TEMP/qa/verdict.txt")" = pass

      - name: Mark PR ready after QA passes
        if: success()
        run: |
          if [ "$(gh pr view "$PR_NUMBER" --json isDraft --jq .isDraft)" = true ]; then
            gh pr ready "$PR_NUMBER"
          fi

      - name: Mark blocked on failure
        if: failure() && steps.transition.outcome == 'success'
        env:
          REPORT_PUBLISHED: ${{ steps.report.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          if [ "$REPORT_PUBLISHED" != success ]; then
            printf '`agent:qa` 未能发布有效验收报告。\n\n运行记录：%s\n\n处理原因后重新添加 `agent:qa`。\n' "$RUN_URL" > "$RUNNER_TEMP/qa-failure.md"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/qa-failure.md"
          fi

      - name: Always remove in-progress
        if: always() && steps.transition.outcome == 'success'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
