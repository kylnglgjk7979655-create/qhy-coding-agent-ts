name: Agent Publish Tickets
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: '队列中的目标 Issue 编号'
        type: string
        required: true
      approved_at:
        description: '审批时 Issue 版本时间'
        type: string
        required: true
      queue_request_id:
        description: '由持久化订阅队列分发的请求编号'
        type: string
        required: true
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.queue_request_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: agent-ticket-control-${{ github.repository }}-${{ inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      APPROVED_AT: ${{ inputs.approved_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify queued authorization
        uses: ./.github/actions/queue-authorization
        with:
          queue-request-id: ${{ inputs.queue_request_id }}
          item-number: ${{ inputs.issue_number }}
          workflow: agent-publish-tickets.yml
      - uses: ./.github/actions/setup
      - name: Publish approved plan with native dependencies
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts publish
