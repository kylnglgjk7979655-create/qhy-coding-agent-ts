name: Codex Task Router
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      number:
        required: true
        type: string
      auth_secret:
        default: ''
        type: string
permissions: {}
concurrency:
  group: codex-task-${{ github.repository }}-${{ inputs.number }}
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      auth_secret: ${{ steps.route.outputs.auth_secret }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: route
        env:
          TASK_NUMBER: ${{ inputs.number }}
          REQUESTED_AUTH_SLOT: ${{ inputs.auth_secret }}
          CODEX_AUTH_SLOTS: ${{ vars.CODEX_AUTH_SLOTS }}
        with:
          script: |
            const { selectAuthSlot } = require('./.github/scripts/auth-slots.cjs');
            core.setOutput('auth_secret', selectAuthSlot(process.env.TASK_NUMBER, process.env.REQUESTED_AUTH_SLOT));
  execute:
    needs: route
    uses: ./.github/workflows/codex-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    with:
      mode: ${{ inputs.mode }}
      number: ${{ inputs.number }}
      auth_secret: ${{ needs.route.outputs.auth_secret }}
    secrets: inherit
