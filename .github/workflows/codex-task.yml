name: Codex Subscription Task
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      number:
        required: true
        type: string
    secrets:
      CODEX_AUTH_JSON:
        required: true
      CODEX_AUTH_STORE_PAT:
        required: true
      AGENT_PAT:
        required: false
permissions: {}
concurrency:
  # 所有模型任务和排队派发共用一份订阅登录，必须使用同一个并发组。
  group: codex-subscription-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    outputs:
      proceed: ${{ steps.prepare.outputs.proceed }}
      subject: ${{ steps.prepare.outputs.subject }}
      mode: ${{ steps.prepare.outputs.mode }}
      sha: ${{ steps.prepare.outputs.sha }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      control_sha: ${{ steps.control.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: control
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        id: prepare
        env:
          TASK_MODE: ${{ inputs.mode }}
          TASK_NUMBER: ${{ inputs.number }}
        with:
          script: await require('./.github/scripts/tasks.cjs').prepare({ github, context, core })
      - uses: actions/github-script@v7
        id: queued
        if: steps.prepare.outputs.proceed == 'true'
        with:
          script: |
            const { data } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            core.setOutput('created_at', data.created_at);
      - name: 获取加密公钥并检查登录态版本
        if: steps.prepare.outputs.proceed == 'true'
        uses: actions/github-script@v7
        env:
          AUTH_STORE_CONFIGURED: ${{ secrets.CODEX_AUTH_STORE_PAT != '' }}
          AUTH_JSON_CONFIGURED: ${{ secrets.CODEX_AUTH_JSON != '' }}
          RUN_CREATED_AT: ${{ steps.queued.outputs.created_at }}
        with:
          github-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}
          script: await require('./.github/scripts/subscription.cjs').publicKey({ github, context })
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.proceed == 'true'
        with:
          name: codex-context
          path: ${{ runner.temp }}/codex-context/task.json
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.proceed == 'true'
        with:
          name: codex-public-key
          path: ${{ runner.temp }}/codex-public-key/key.json
          retention-days: 1

  generate:
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      auth_artifact: ${{ steps.upload-auth.outputs.artifact-id }}
      auth_skipped: ${{ needs.prepare.outputs.mode == 'update-branch' && steps.merge.outputs.requires_agent == 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: codex-context
          path: ${{ runner.temp }}/codex-context
      - uses: actions/download-artifact@v4
        with:
          name: codex-public-key
          path: ${{ runner.temp }}/codex-public-key
      - name: 创建固定 SHA 的独立工作区
        env:
          TASK_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/codex-work" "$TASK_SHA"
          pnpm --dir "$RUNNER_TEMP/codex-work" install --frozen-lockfile --ignore-scripts
      - name: 分类合并结果，无冲突时直接完成
        id: merge
        if: needs.prepare.outputs.mode == 'update-branch'
        env:
          AGENT_WORKSPACE: ${{ runner.temp }}/codex-work
        run: node .github/scripts/tasks.cjs merge
      - name: 恢复订阅登录
        if: needs.prepare.outputs.mode != 'update-branch' || steps.merge.outputs.requires_agent == 'true'
        id: restore
        uses: actions/github-script@v7
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        with:
          script: await require('./.github/scripts/subscription.cjs').restore(core.setSecret)
      - name: 使用 Sandcastle 启动订阅 Codex
        if: needs.prepare.outputs.mode != 'update-branch' || steps.merge.outputs.requires_agent == 'true'
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_AUTH_MODE: chatgpt
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          TASK_CONTEXT_PATH: ${{ runner.temp }}/codex-context/task.json
          AGENT_WORKSPACE: ${{ runner.temp }}/codex-work
          AGENT_OUTPUT_DIR: ${{ runner.temp }}/codex-result
        run: pnpm agent:task
      - name: 加密刷新后的登录态
        id: seal
        if: always() && steps.restore.outcome == 'success'
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: node .github/scripts/subscription.cjs seal
      - uses: actions/upload-artifact@v4
        id: upload-auth
        if: always() && steps.seal.outcome == 'success'
        with:
          name: codex-auth-update
          path: ${{ runner.temp }}/codex-auth-update/encrypted.json
          retention-days: 1
          if-no-files-found: error
      - name: 清理临时登录文件
        if: always()
        run: rm -rf "$RUNNER_TEMP/codex-home"
      - name: 独立验证修改
        if: needs.prepare.outputs.mode != 'architecture' && needs.prepare.outputs.mode != 'to-issues'
        run: |
          pnpm --dir "$RUNNER_TEMP/codex-work" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/codex-work" check
          pnpm --dir "$RUNNER_TEMP/codex-work" demo:test
      - name: 校验结果并导出补丁
        env:
          AGENT_WORKSPACE: ${{ runner.temp }}/codex-work
        run: node .github/scripts/tasks.cjs export
      - uses: actions/upload-artifact@v4
        with:
          name: codex-result
          path: ${{ runner.temp }}/codex-result/
          retention-days: 3
          if-no-files-found: error

  persist-auth:
    needs: [prepare, generate]
    if: always() && needs.prepare.result == 'success' && needs.generate.outputs.auth_artifact != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: codex-auth-update
          path: ${{ runner.temp }}/codex-auth-update
      - name: 保存刷新后的订阅登录态
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}
          script: await require('./.github/scripts/subscription.cjs').persist({ github, context })

  publish:
    needs: [prepare, generate, persist-auth]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.proceed == 'true' && needs.generate.result == 'success' &&
      (needs.persist-auth.result == 'success' ||
      (needs.generate.outputs.auth_skipped == 'true' && needs.persist-auth.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      url: ${{ steps.publish.outputs.url }}
      pr_number: ${{ steps.publish.outputs.pr_number }}
      next: ${{ steps.publish.outputs.next }}
      branch: ${{ steps.publish.outputs.branch }}
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codex-context
          path: ${{ runner.temp }}/codex-context
      - uses: actions/download-artifact@v4
        with:
          name: codex-result
          path: ${{ runner.temp }}/codex-result
      - uses: actions/github-script@v7
        id: publish
        with:
          # API 发布始终使用本 job 的 Token；AGENT_PAT 仅负责 git push。
          script: await require('./.github/scripts/tasks.cjs').publish({ github, context, core })

  finish:
    needs: [prepare, generate, persist-auth, publish]
    if: always() && (needs.prepare.outputs.proceed == 'true' || needs.prepare.outputs.subject != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          TASK_SUBJECT: ${{ needs.prepare.outputs.subject }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          AUTH_RESULT: ${{ needs.persist-auth.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RESULT_URL: ${{ needs.publish.outputs.url }}
          RESULT_PR: ${{ needs.publish.outputs.pr_number }}
          NEXT_TASK: ${{ needs.publish.outputs.next }}
          RESULT_BRANCH: ${{ needs.publish.outputs.branch }}
          CODE_CHANGED: ${{ needs.publish.outputs.changed }}
        with:
          script: await require('./.github/scripts/tasks.cjs').finish({ github, context, core })
