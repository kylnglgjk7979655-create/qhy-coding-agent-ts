name: Agent Queue Ingress

on:
  issues:
    types: [labeled]
  # PR 标签入口和脚本一起部署到可信基准分支。
  pull_request_target:
    types: [labeled]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  enqueue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const result = await require('./.github/scripts/queue-ingress.cjs').route({ github, context });
            core.info(JSON.stringify(result));
