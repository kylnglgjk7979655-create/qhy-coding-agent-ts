name: Agent Implement

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-ticket-control-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Select eligible issue
        id: route
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts prepare

      - name: Build
        if: steps.route.outputs.proceed == 'true'
        run: pnpm build

      - name: Create branch
        if: steps.route.outputs.proceed == 'true'
        run: |
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"
          if [ -n "$PARENT_NUMBER" ]; then
            branch="agent/parent-$PARENT_NUMBER"
          else
            branch="agent/issue-$ISSUE_NUMBER"
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git checkout -b "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Install Claude Code
        if: steps.route.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.323

      - name: Prepare Claude Code config
        if: steps.route.outputs.proceed == 'true'
        run: |
          mkdir -p "$HOME/.claude"
          printf '{"hasCompletedOnboarding":true}\n' > "$HOME/.claude.json"

      - name: Implement and draft PR with skills
        if: steps.route.outputs.proceed == 'true'
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: pnpm exec tsx .sandcastle/agent-workflows/implement/implement.ts

      - name: Verify issue and dependencies before publishing
        if: steps.route.outputs.proceed == 'true' && success()
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts verify

      - name: Push branch
        if: steps.route.outputs.proceed == 'true' && success()
        run: git push --force-with-lease origin "$BRANCH"

      - name: Create or update draft PR
        id: open_pr
        if: steps.route.outputs.proceed == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')
          title=$(cat "$RUNNER_TEMP/pr_title.txt")
          body_file="$RUNNER_TEMP/pr_description.txt"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$title" --body-file "$body_file"
          else
            pr_url=$(gh pr create --draft --base main --head "$BRANCH" --title "$title" --body-file "$body_file" | tail -n1)
            pr_number="${pr_url##*/}"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Complete child and determine whether to review
        id: completion
        if: steps.route.outputs.proceed == 'true' && success()
        # 用 AGENT_PAT 关闭子票，issues closed 事件才能触发 promote-queued。
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "$PARENT_NUMBER" ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue close "$ISSUE_NUMBER" --reason completed --comment "已完成并提交至共享草稿 PR #${PR_NUMBER}；整体审查将在全部子任务完成后进行。"
          gh api --paginate --slurp "repos/$GH_REPO/issues/$PARENT_NUMBER/sub_issues?per_page=100" > "$RUNNER_TEMP/children.json"
          if jq -e 'flatten | length > 0 and all(.[]; .state == "closed" and .state_reason == "completed")' "$RUNNER_TEMP/children.json" > /dev/null; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request automated review
        if: steps.route.outputs.proceed == 'true' && steps.completion.outputs.review == 'true' && success()
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts review

      - name: Finish parent queue
        if: steps.route.outputs.proceed == 'true' && steps.completion.outputs.review == 'true' && env.PARENT_NUMBER != '' && success()
        run: |
          gh issue edit "$PARENT_NUMBER" --remove-label "agent:queued"
          gh issue comment "$PARENT_NUMBER" --body '所有子任务已完成，已请求整体审查；共享 PR 合并到 main 后将自动关闭本父 Issue。'

      - name: Continue parent with PAT
        if: steps.route.outputs.proceed == 'true' && steps.completion.outputs.review == 'false' && success()
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts continue-parent

      - name: Mark blocked on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="请查看 workflow 日志"
          if [ -f "$RUNNER_TEMP/failure_reason.txt" ]; then
            reason=$(cat "$RUNNER_TEMP/failure_reason.txt")
          fi
          body_file="$RUNNER_TEMP/failure-comment.md"
          if [ -n "$PARENT_NUMBER" ] && [ "$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)" = "CLOSED" ]; then
            printf '子任务已提交，但后续发布步骤失败。请检查共享 PR，并手动完成审查或清理父 Issue 的排队标签。\n\n原因：%s\n\n运行：%s\n' "$reason" "$RUN_URL" > "$body_file"
          else
            printf '自动实现失败，等待人工处理。\n\n原因：%s\n\n运行：%s\n\n处理后重新添加本 Issue 的 agent:implement。\n' "$reason" "$RUN_URL" > "$body_file"
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" --add-label "agent:blocked" || true
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always() && steps.route.outputs.proceed == 'true'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true