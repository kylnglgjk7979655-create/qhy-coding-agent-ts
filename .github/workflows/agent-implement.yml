name: Agent Implement

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '内部接续：仍携带 agent:implement 标签的 Issue 编号'
        type: string
        required: true

# 锁覆盖认证恢复、模型执行、回存与发布；queued 扫描负责找回被替换的待运行任务。
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:implement') && format('codex-subscription-{0}', github.repository) || format('agent-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-ticket-control-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      CODEX_MODEL: ${{ vars.CODEX_MODEL }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Select eligible issue
        id: route
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts prepare

      - name: Build
        if: steps.route.outputs.proceed == 'true'
        run: pnpm build

      - name: Create branch
        if: steps.route.outputs.proceed == 'true'
        run: |
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"
          branch="agent/issue-$ISSUE_NUMBER"
          git checkout -b "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Restore Codex subscription
        id: auth
        if: steps.route.outputs.proceed == 'true'
        uses: ./.github/actions/codex-auth-restore
        with:
          auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}

      - name: Run implementation agent
        if: steps.route.outputs.proceed == 'true'
        run: pnpm exec tsx .sandcastle/agent-workflows/implement/implement.ts

      - name: Save refreshed Codex subscription
        if: always() && steps.auth.outputs.restored == 'true'
        uses: ./.github/actions/codex-auth-save
        with:
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}

      - name: Verify issue and dependencies before publishing
        if: steps.route.outputs.proceed == 'true' && success()
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts verify

      - name: Push branch
        if: steps.route.outputs.proceed == 'true' && success()
        run: git push --force-with-lease origin "$BRANCH"

      - name: Open draft PR
        id: open_pr
        if: steps.route.outputs.proceed == 'true' && success()
        run: |
          title="Fix #$ISSUE_NUMBER: $ISSUE_TITLE"
          title="${title:0:256}"
          body_file="$RUNNER_TEMP/pr-body.md"
          {
            echo "Closes #$ISSUE_NUMBER"
            if [ -n "$PARENT_NUMBER" ]; then
              echo
              echo "Parent: #$PARENT_NUMBER"
            fi
            echo
            echo "Implemented by the Sandcastle agent workflow."
          } > "$body_file"
          pr_url=$(gh pr create --draft --base main --head "$BRANCH" --title "$title" --body-file "$body_file" | tail -n1)
          echo "pr_number=$(basename "$pr_url")" >> "$GITHUB_OUTPUT"

      - name: Request automated review
        if: steps.route.outputs.proceed == 'true' && success()
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: pnpm exec tsx .sandcastle/agent-workflows/tickets/control.ts review

      - name: Mark blocked on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="请查看 workflow 日志"
          if [ -f "$RUNNER_TEMP/failure_reason.txt" ]; then
            reason=$(cat "$RUNNER_TEMP/failure_reason.txt")
          fi
          body_file="$RUNNER_TEMP/failure-comment.md"
          printf '自动实现失败，等待人工处理。\n\n原因：%s\n\n运行：%s\n\n处理后重新添加本 Issue 的 agent:implement。\n' "$reason" "$RUN_URL" > "$body_file"
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always() && steps.route.outputs.proceed == 'true'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
