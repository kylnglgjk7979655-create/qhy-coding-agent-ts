name: Codex Auth Diagnostic (temporary)
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 要实现的 GitHub Issue 编号
        required: true
        type: string
permissions: {}
concurrency:
  # 同一份订阅登录态需要串行刷新，不能按 Issue 分别并发。
  group: codex-subscription-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'ready-for-agent' ||
      github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    outputs:
      proceed: ${{ steps.prepare.outputs.proceed }}
      issue: ${{ steps.prepare.outputs.issue }}
      base: ${{ steps.prepare.outputs.base }}
      sha: ${{ steps.prepare.outputs.sha }}
      branch: ${{ steps.prepare.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: prepare
        env:
          INPUT_ISSUE: ${{ inputs.issue_number }}
        with:
          script: await require('./.github/scripts/agent.cjs').prepare({ github, context, core })
      - uses: actions/github-script@v7
        id: queued
        if: steps.prepare.outputs.proceed == 'true'
        with:
          script: |
            const { data } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            core.setOutput('created_at', data.created_at);
      - name: 获取认证加密公钥并检查登录态版本
        if: steps.prepare.outputs.proceed == 'true'
        uses: actions/github-script@v7
        env:
          AUTH_STORE_CONFIGURED: ${{ secrets.CODEX_AUTH_STORE_PAT != '' }}
          AUTH_JSON_CONFIGURED: ${{ secrets.CODEX_AUTH_JSON != '' }}
          RUN_CREATED_AT: ${{ steps.queued.outputs.created_at }}
        with:
          github-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}
          script: await require('./.github/scripts/subscription.cjs').publicKey({ github, context })
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.proceed == 'true'
        with:
          name: codex-public-key
          path: ${{ runner.temp }}/codex-public-key/key.json
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.proceed == 'true'
        with:
          name: issue-context
          path: ${{ runner.temp }}/codex-context/issue.json
          retention-days: 1

  generate:
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      auth_artifact: ${{ steps.upload-auth.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: issue-context
          path: ${{ runner.temp }}/codex-context
      - uses: actions/download-artifact@v4
        with:
          name: codex-public-key
          path: ${{ runner.temp }}/codex-public-key
      - name: 创建工作分支
        env:
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          git config user.name 'codex[bot]'
          git config user.email 'codex[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
      - name: 恢复订阅登录
        id: restore
        uses: actions/github-script@v7
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        with:
          script: await require('./.github/scripts/subscription.cjs').restore(core.setSecret)
      - name: 使用 Sandcastle 启动订阅 Codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_AUTH_MODE: chatgpt
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          ISSUE_CONTEXT_PATH: ${{ runner.temp }}/codex-context/issue.json
          AGENT_OUTPUT_DIR: ${{ runner.temp }}/codex-result
        run: |
          pnpm exec codex exec --json --sandbox read-only -m "${CODEX_MODEL:-gpt-5.4}" 'Do not run tools. Reply only OK.' 
      - name: 用 GitHub 公钥加密刷新后的登录态
        id: seal
        if: always() && steps.restore.outcome == 'success'
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: node .github/scripts/subscription.cjs seal
      - uses: actions/upload-artifact@v4
        id: upload-auth
        if: always() && steps.seal.outcome == 'success'
        with:
          name: codex-auth-update
          path: ${{ runner.temp }}/codex-auth-update/encrypted.json
          retention-days: 1
          if-no-files-found: error
      - name: 清理临时登录文件
        if: always()
        run: rm -rf "$RUNNER_TEMP/codex-home"

  persist-auth:
    needs: [prepare, generate]
    if: always() && needs.prepare.result == 'success' && needs.generate.outputs.auth_artifact != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: codex-auth-update
          path: ${{ runner.temp }}/codex-auth-update
      - name: 将加密登录态写回仓库 Secret
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}
          script: await require('./.github/scripts/subscription.cjs').persist({ github, context })

  publish:
    if: false
    needs: [prepare, generate, persist-auth]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: write
    outputs:
      pr_url: ${{ steps.publish.outputs.pr_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.AGENT_PAT || github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codex-result
          path: ${{ runner.temp }}/codex-result
      - uses: actions/github-script@v7
        id: publish
        env:
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
          BASE_BRANCH: ${{ needs.prepare.outputs.base }}
          AGENT_BRANCH: ${{ needs.prepare.outputs.branch }}
        with:
          github-token: ${{ secrets.AGENT_PAT || github.token }}
          script: await require('./.github/scripts/agent.cjs').publish({ github, context, core })

  finish:
    needs: [prepare, generate, persist-auth, publish]
    if: always() && needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          AUTH_RESULT: ${{ needs.persist-auth.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PR_URL: ${{ needs.publish.outputs.pr_url }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const args = { ...context.repo, issue_number };
            const ok = process.env.GENERATE_RESULT === 'success' && process.env.AUTH_RESULT === 'success';
            if (!ok) await github.rest.issues.addLabels({ ...args, labels: ['agent:blocked'] });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = ok
              ? `Codex 订阅认证诊断成功：仅回复 OK，未修改代码。\n\n运行记录：${run}。请人工审查并决定合并。`
              : `Codex 运行未完成。生成：${process.env.GENERATE_RESULT}；登录态保存：${process.env.AUTH_RESULT}；发布：${process.env.PUBLISH_RESULT}。\n\n日志：${run}\n\n处理原因后，重新添加 ready-for-agent 或 agent:implement 标签即可重试。`;
            try {
              await github.rest.issues.createComment({ ...args, body });
            } finally {
              try { await github.rest.issues.removeLabel({ ...args, name: 'agent:in-progress' }); }
              catch (error) { if (error.status !== 404) throw error; }
            }
