name: Agent Update Branch

on:
  # Agent Queue dispatches from the base branch after confirming this is an open same-repository PR.
  workflow_dispatch:
    inputs:
      pr_number:
        description: '队列中的目标 PR 编号'
        type: string
        required: true
      queue_request_id:
        description: '由持久化订阅队列分发的请求编号'
        type: string
        required: true
      expected_head_sha:
        description: '入队时记录的 PR 分支版本'
        type: string
        required: false

jobs:
  update-branch:
    # Same-repo PRs only: fork PRs never run here, so a fork's code never runs
    # with repo secrets.
    if: github.event_name == 'workflow_dispatch' && inputs.queue_request_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: write

    env:
      CODEX_MODEL: ${{ vars.CODEX_MODEL }}
      PR_NUMBER: ${{ inputs.pr_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout trusted queue scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify queued authorization
        uses: ./.github/actions/queue-authorization
        with:
          queue-request-id: ${{ inputs.queue_request_id }}
          item-number: ${{ inputs.pr_number }}
          workflow: agent-update-branch.yml
          expected-head-sha: ${{ inputs.expected_head_sha }}

      - name: Read and verify same-repository PR
        id: pr
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          gh pr view "$PR_NUMBER" --json state,isCrossRepository,headRefName,headRefOid,baseRefName --jq 'select(.state == "OPEN" and .isCrossRepository == false) | [.headRefName, .headRefOid, .baseRefName] | @tsv' > "$RUNNER_TEMP/pr.tsv"
          if [ ! -s "$RUNNER_TEMP/pr.tsv" ]; then echo "PR must be open and belong to this repository." >&2; exit 1; fi
          IFS=$'\t' read -r branch head_sha base < "$RUNNER_TEMP/pr.tsv"
          if [ -n "$EXPECTED_HEAD_SHA" ] && [ "$EXPECTED_HEAD_SHA" != "$head_sha" ]; then
            echo "PR branch changed after enqueue; please re-add agent:update-branch." >&2; exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          echo "BRANCH_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
          echo "BASE_REF=$base" >> "$GITHUB_ENV"
      - name: Transition labels
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          path: worktree
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare branch
        working-directory: worktree
        run: |
          git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Build
        working-directory: worktree
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Restore Codex subscription
        id: auth
        uses: ./.github/actions/codex-auth-restore
        with:
          auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}

      - name: Run update-branch agent
        id: run
        working-directory: worktree
        env:
          OUTPUT_DIR: ${{ runner.temp }}
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          tsx "$GITHUB_WORKSPACE/.sandcastle/agent-workflows/update-branch/update-branch.ts"

      - name: Save refreshed Codex subscription
        if: always() && steps.auth.outputs.restored == 'true'
        uses: ./.github/actions/codex-auth-save
        with:
          store-token: ${{ secrets.CODEX_AUTH_STORE_PAT }}

      - name: Push branch (abort cleanly if non-fast-forward)
        if: success()
        working-directory: worktree
        env:
          SHOULD_PUSH_FILE: ${{ runner.temp }}/should_push.txt
        run: |
          gh pr view "$PR_NUMBER" --json state,headRefOid,labels > "$RUNNER_TEMP/current-pr.json"
          jq -e --arg sha "$BRANCH_HEAD_SHA" '.state == "OPEN" and .headRefOid == $sha and any(.labels[]; .name == "agent:in-progress") and (all(.labels[]; .name != "agent:blocked"))' "$RUNNER_TEMP/current-pr.json" > /dev/null
          if [ ! -f "$SHOULD_PUSH_FILE" ] || [ "$(cat "$SHOULD_PUSH_FILE")" != "true" ]; then
            echo "Nothing to push."
            exit 0
          fi
          # Lease against the SHA we checked out — fails if anything pushed
          # to the branch during our run (race detection), and tolerates
          # history-rewriting updates (rebase) when the remote is unchanged.
          set +e
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during update-branch run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi

      - name: Post PR comment
        if: success()
        env:
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: |
          if [ -f "$COMMENT_FILE" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"
          fi

      - name: Mark blocked on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:update-branch` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:update-branch` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always()
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
