name: Agent Queue

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

# A waiting dispatcher can replace another waiting dispatcher safely: every
# request is durable on its source Issue/PR and each dispatcher drains the queue.
concurrency:
  group: codex-subscription-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_AUTH_STORE_PAT: ${{ secrets.CODEX_AUTH_STORE_PAT }}
        with:
          script: await require('./.github/scripts/queue-worker.cjs').run({ github, context })
